name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # 実機のHAもSupervisorも無いので、到達できない宛先で待ち続けるテストがあれば
    # ここで打ち切って気づけるようにする。
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install runtime tools that the add-on image has
        # embodied_ha/Dockerfile が apt で入れているもののうち、テストが実際に使うのは ffmpeg。
        # 無いと音声ファイルの staging が例外になり、本番では起きない失敗が出る。
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - uses: actions/setup-python@v5
        with:
          # 本番イメージ（embodied_ha/Dockerfile の python:3.11-slim-bookworm）と同じminorに固定する。
          # 3.12で通っても本番で通る保証にならない。
          python-version: "3.11"

      - name: Check runtime pins match the Dockerfile
        run: |
          docker_pin=$(grep -oE 'websockets==[0-9.]+' embodied_ha/Dockerfile)
          ci_pin=$(grep -oE 'websockets==[0-9.]+' requirements-ci.txt)
          if [ "$docker_pin" != "$ci_pin" ]; then
            echo "Dockerfile: $docker_pin / requirements-ci.txt: $ci_pin"
            echo "CIと本番イメージでランタイム依存のピンがずれている。両方を揃えること。"
            exit 1
          fi
          echo "runtime pin: $docker_pin"

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Run unittest suite
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Run pytest-style tests
        # tests/ の大半は unittest だが、pytest でしか収集できない書き方の
        # ファイルもある。unittest discover は import するだけで実行しないため別で走らせる。
        run: python -m pytest tests/test_wake_routing.py

      - name: Lint
        run: ruff check .

      - name: Check public repo hygiene
        # AGENTS.md の「personal_data/ は公開リポジトリから除外する」を宣言のままにしない。
        run: python3 scripts/check_repo_hygiene.py

  release-invariants:
    # 「mainの公開状態はversionを伴うリリースでしか動かない」の検査。
    # mainを動かすpushと、mainへ向いたPRだけが対象。作業ブランチでは版番号を
    # 動かさずに embodied_ha/ を触るのが普通なので、そこでは走らせない。
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          # 版番号の履歴を config.yaml から辿るので全履歴が要る（タグは使わない）。
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check release invariants
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/check_release_invariants.py --base "$BASE" --head "$HEAD"
